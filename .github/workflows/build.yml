name: Build Plugin JAR

on:
  push:
    branches: [ "main" ] # Uruchom przy każdym zapisie kodu na gałęzi main
  workflow_dispatch:      # Pozwala uruchomić budowanie ręcznie

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: mvn -B package --file pom.xml

    - name: Upload Artifact
      uses: actions/upload-artifact@v3
      with:
        name: Gotowy-Plugin
        path: target/*.jar
