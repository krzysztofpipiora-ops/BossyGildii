name: Build Plugin JAR

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4 # Zaktualizowane do v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4 # Zaktualizowane do v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: mvn -B package --file pom.xml

    - name: Upload Artifact
      uses: actions/upload-artifact@v4 # To naprawia Twój błąd!
      with:
        name: Gotowy-Plugin
        path: target/*.jar
